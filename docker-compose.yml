version: '3.9'

services:

  # ==========================
  # ZOOKEEPER
  # ==========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - backend

  # ==========================
  # KAFKA
  # ==========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend

  # ==========================
  # POSTGRESQL (YOUR DB MOVED TO DOCKER)
  # ==========================
  postgres:
    image: postgres:17
    container_name: postgres-bookshop
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ShivaniDeviyani@2025
      POSTGRES_DB: bookshop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup   # Your backup goes here
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
